<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" fill="none">
  <title>Một tô cơm cân bằng, đầy sắc màu</title>
  <desc>Minh họa vẽ tay tô gốm chứa gạo lứt, cá hồi nướng, trứng, dưa leo, cà chua và rau xanh tươi.</desc>
  <defs>
    <radialGradient id="ceramic" cx=".36" cy=".28" r=".75"><stop stop-color="#fffef7"/><stop offset=".75" stop-color="#f4f0df"/><stop offset="1" stop-color="#d6d8bf"/></radialGradient>
    <radialGradient id="inside" cx=".46" cy=".4" r=".63"><stop stop-color="#f8f5df"/><stop offset="1" stop-color="#e3ddbb"/></radialGradient>
    <linearGradient id="fish" x1="212" y1="315" x2="383" y2="408" gradientUnits="userSpaceOnUse"><stop stop-color="#f2a176"/><stop offset=".5" stop-color="#e78a61"/><stop offset="1" stop-color="#cb6b4c"/></linearGradient>
    <radialGradient id="yolk"><stop stop-color="#ffc945"/><stop offset=".75" stop-color="#f0b62e"/><stop offset="1" stop-color="#dfa32a"/></radialGradient>
    <linearGradient id="leaf" x1="320" y1="135" x2="412" y2="235" gradientUnits="userSpaceOnUse"><stop stop-color="#86aa51"/><stop offset="1" stop-color="#467b42"/></linearGradient>
    <linearGradient id="cucumber"><stop stop-color="#cee0a0"/><stop offset="1" stop-color="#9fbe6c"/></linearGradient>
    <pattern id="rice" x="0" y="0" width="28" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <path d="M4 5c3-3 9-2 10 0 1 3-6 5-9 3-2-1-2-2-1-3Z" fill="#d6b980"/>
      <path d="M17 15c3-3 9-2 10 1 0 2-6 4-9 3-2-1-2-3-1-4Z" fill="#c9a66b"/>
      <path d="M3 20c2-2 8-2 9 0 1 3-5 5-8 4-2-1-2-3-1-4Z" fill="#ead4a2"/>
      <path d="M17 4l5-1M6 7l5-1M20 18l4-1" stroke="#f3e0b7" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <pattern id="sesame" width="37" height="29" patternUnits="userSpaceOnUse" patternTransform="rotate(23)"><ellipse cx="8" cy="7" rx="1.2" ry="2.5" fill="#f7e9b7"/><ellipse cx="28" cy="24" rx="1" ry="2" fill="#735840"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="foodClip"><circle cx="279" cy="279" r="183"/></clipPath>
    <g id="cucumberSlice">
      <ellipse rx="32" ry="24" fill="#467c49"/>
      <ellipse rx="28" ry="21" fill="#87aa59"/>
      <ellipse rx="24" ry="18" fill="url(#cucumber)"/>
      <path d="M-2-14C2-6 2 3 0 14M-18-7C-8-3-1 0 17 8M18-8C9-3-4 4-17 9" stroke="#e8eac4" stroke-width="3" stroke-linecap="round"/>
      <g fill="#f5f0cf"><ellipse cx="-8" cy="-5" rx="2.3" ry="1.5" transform="rotate(20 -8 -5)"/><ellipse cx="10" cy="-4" rx="2.3" ry="1.5" transform="rotate(-24 10 -4)"/><ellipse cx="-9" cy="7" rx="2.3" ry="1.5"/><ellipse cx="8" cy="7" rx="2.3" ry="1.5"/><ellipse cy="-9" rx="1.5" ry="2"/><ellipse cy="7" rx="1.5" ry="2"/></g>
      <path d="M-25-6C-21-16-5-20 7-17" stroke="#c5d398" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <g id="tomato">
      <ellipse rx="24" ry="22" fill="#b9513e"/>
      <ellipse cy="-2" rx="23" ry="20" fill="#e17b57"/>
      <path d="M-17-6C-13-17 3-19 13-10" stroke="#f4aa81" stroke-width="2" stroke-linecap="round"/>
      <path d="M-2-19l5 4 5-3-2 6 6 3-8 1-2 7-3-6-6 1 4-5-5-4 6 1Z" fill="#648046"/>
    </g>
    <g id="herb">
      <path d="M0 24C2 6 1-10 8-24" stroke="#446e3e" stroke-width="2" stroke-linecap="round"/>
      <path d="M2 11C-11 9-18-3-12-9 0-11 8 2 2 11Z" fill="#6e974d"/>
      <path d="M2-3C12-5 22-16 14-21 4-22-1-11 2-3Z" fill="#85a759"/>
      <path d="M6-15C-3-14-9-24-3-29 8-29 10-22 6-15Z" fill="#668d4e"/>
      <path d="M1 7l-10-12M3-6l10-11" stroke="#b6c382" stroke-width="1"/>
    </g>
  </defs>
  <!-- The ceramic rim and softly pooled natural shadow. -->
  <ellipse cx="289" cy="316" rx="196" ry="179" fill="#69744a" opacity=".14" filter="url(#shadow)"/>
  <circle cx="280" cy="282" r="207" fill="#bcc3a0"/>
  <circle cx="277" cy="276" r="207" fill="url(#ceramic)"/>
  <circle cx="278" cy="278" r="194" stroke="#dedfc7" stroke-width="2"/>
  <circle cx="279" cy="279" r="184" fill="url(#inside)" stroke="#c8caac" stroke-width="2"/>
  <path d="M112 190c21-54 76-91 137-95" stroke="#fffef8" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M379 447c-52 26-102 33-158 17" stroke="#c3c9a9" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <g clip-path="url(#foodClip)">
    <!-- Nutty grains, each kernel drawn rather than a photographic texture. -->
    <path d="M99 206c39-62 103-106 175-110 32 18 39 71 37 115 7 54-6 82-24 119-41 20-121 17-166-12-24-29-37-74-22-112Z" fill="#dfc58e"/>
    <path d="M99 206c39-62 103-106 175-110 32 18 39 71 37 115 7 54-6 82-24 119-41 20-121 17-166-12-24-29-37-74-22-112Z" fill="url(#rice)"/>
    <path d="M119 230c32-34 104-61 160-57M135 292c41-25 86-33 130-31" stroke="#f6e4bb" stroke-width="2" opacity=".5"/>
    <!-- Ruffled greens. -->
    <path d="M274 111c14-19 22-17 31-6 12-16 29-9 35 2 18-13 34-4 38 11 17-9 31 6 27 22 20-1 30 12 22 27 23 7 20 29 8 37 9 16 6 35-11 36-8 21-27 14-33 4-14 16-28 9-30-6-19 11-37 2-33-15-25 0-30-16-21-26-23-2-25-17-16-29-15-16-22-32-17-57Z" fill="#4e7e43"/>
    <path d="M285 120c13-15 23-6 28 4 14-15 30-7 31 8 14-10 29-4 31 12 21-7 34 3 30 17 19 5 22 18 9 29 9 14 2 24-11 24-9 20-23 19-31 3-17 13-31 0-27-12-22 6-33-9-25-20-20-6-26-19-17-33-18-7-27-21-18-32Z" fill="url(#leaf)"/>
    <path d="M283 138c32 21 62 39 107 65M307 153l-4-27m27 40 5-33m11 42 34-16m-18 31 32-3" stroke="#b3c787" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <path d="M382 133c17 9 33 12 40 28M290 109c-5 19 5 30 13 34" stroke="#a1ba74" stroke-width="2" opacity=".6"/>
    <!-- Fans of freshly sliced cucumber. -->
    <g transform="translate(414 215) rotate(62)"><use href="#cucumberSlice"/></g>
    <g transform="translate(424 244) rotate(63)"><use href="#cucumberSlice"/></g>
    <g transform="translate(429 276) rotate(68)"><use href="#cucumberSlice"/></g>
    <g transform="translate(423 307) rotate(74)"><use href="#cucumberSlice"/></g>
    <g transform="translate(411 335) rotate(92)"><use href="#cucumberSlice"/></g>
    <!-- Thin radish rounds, pale blush and fine translucent veins. -->
    <g transform="translate(348 271) rotate(-19)"><ellipse rx="39" ry="28" fill="#d9988c"/><ellipse rx="36" ry="25" fill="#fff6dd"/><ellipse rx="31" ry="21" fill="#f7efd6"/><path d="M-24-8L23 8M-20 13L21-13M0-18v35" stroke="#e9c8af" stroke-width="1"/></g>
    <g transform="translate(352 296) rotate(10)"><ellipse rx="39" ry="27" fill="#c88779"/><ellipse rx="36" ry="24" fill="#fff5df"/><path d="M-27-4l52 8M-15-17l29 32M-14 17l29-34" stroke="#edd4bc" stroke-width="1"/></g>
    <!-- Roasted salmon, an irregular hand-cut fillet and curved flakes. -->
    <path d="M191 317c5-11 29-21 41-21l132 25c18 8 30 25 35 42l-49 67c-12 12-34 12-49 8l-108-63c-15-13-19-32-2-58Z" fill="#ad6246"/>
    <path d="M194 311c9-12 26-19 43-14l119 23c18 6 35 23 39 37-8 17-20 31-34 48-8 13-25 23-41 19l-121-63c-19-10-22-30-5-50Z" fill="url(#fish)"/>
    <path d="M225 301c-1 21 9 28 27 38l100 56M206 307c-3 23 8 34 30 44l103 58M249 303c2 18 11 28 29 37l85 45M273 308c1 12 8 24 26 33l75 34M297 312c5 12 10 20 23 27l63 30M316 317c5 8 14 14 30 21l42 21" stroke="#ffd0a4" stroke-width="4" stroke-linecap="round" opacity=".85"/>
    <path d="M227 306c2 9 5 15 13 20M251 311c3 9 6 15 15 20M275 315c3 9 7 15 15 19M300 320c5 10 10 14 21 20M204 324c2 13 6 19 21 26" stroke="#bb694d" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M198 355l115 63c14 8 23 2 32-6" stroke="#f1af81" stroke-width="3" stroke-linecap="round"/>
    <path d="M194 311c9-12 26-19 43-14l119 23c18 6 35 23 39 37-8 17-20 31-34 48-8 13-25 23-41 19l-121-63c-19-10-22-30-5-50Z" fill="url(#sesame)"/>
    <!-- Soft-boiled egg halves. -->
    <g transform="translate(175 224) rotate(-33)">
      <path d="M-42 4C-42-37-23-58 1-59c25-1 46 23 46 57 0 33-20 52-43 52-24 1-46-15-46-50Z" fill="#d9ceab"/>
      <path d="M-43-2c0-38 19-60 44-60 25 0 43 23 43 57 0 31-18 49-42 50-25 1-45-16-45-47Z" fill="#fffdf0"/>
      <path d="M-32-21c4-19 15-31 28-32" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="2" cy="4" rx="29" ry="30" fill="url(#yolk)"/>
      <path d="M-18-7c5-15 23-21 34-12" stroke="#ffe07e" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="8" cy="12" rx="10" ry="12" fill="#f7bd30" opacity=".6"/>
    </g>
    <g transform="translate(226 160) rotate(34)">
      <path d="M-33 3c0-31 14-51 35-51 21 0 37 21 37 49 0 26-16 44-36 44-21 0-36-17-36-42Z" fill="#d9cdae"/>
      <path d="M-34-1c0-30 16-51 36-51 21 0 35 21 35 49 0 25-15 41-35 42-20 0-36-15-36-40Z" fill="#fffcef"/>
      <ellipse cy="2" rx="24" ry="25" fill="url(#yolk)"/>
      <path d="M-14-10c6-9 17-12 26-7" stroke="#ffe185" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Cherry tomatoes nestling against the warm grains. -->
    <g transform="translate(138 325) rotate(-12)"><use href="#tomato"/></g>
    <g transform="translate(156 368) rotate(23)"><use href="#tomato"/></g>
    <g transform="translate(192 397) rotate(-27)"><use href="#tomato"/></g>
    <g transform="translate(136 294) rotate(12) scale(.8)"><use href="#tomato"/></g>
    <!-- Cilantro and scattered scallion rings finish the bowl. -->
    <g transform="translate(272 251) rotate(-24)"><use href="#herb"/></g>
    <g transform="translate(285 267) rotate(29) scale(.87)"><use href="#herb"/></g>
    <g transform="translate(272 405) rotate(76) scale(.85)"><use href="#herb"/></g>
    <g stroke="#688b46" stroke-width="3" fill="#d3dc9b"><ellipse cx="319" cy="348" rx="5" ry="3" transform="rotate(-30 319 348)"/><ellipse cx="244" cy="365" rx="5" ry="3" transform="rotate(25 244 365)"/><ellipse cx="294" cy="386" rx="4" ry="3" transform="rotate(-22 294 386)"/><ellipse cx="219" cy="281" rx="5" ry="3"/><ellipse cx="336" cy="194" rx="4" ry="3"/></g>
    <g fill="#4e6840"><circle cx="178" cy="271" r="1.4"/><circle cx="164" cy="242" r="1.4"/><circle cx="214" cy="177" r="1.3"/><circle cx="205" cy="145" r="1"/><circle cx="243" cy="193" r="1.3"/><circle cx="288" cy="356" r="1.2"/><circle cx="347" cy="366" r="1.2"/></g>
  </g>
  <!-- Loose botanical strokes add a handmade, editorial edge. -->
  <g transform="translate(451 121) rotate(27)"><path d="M0 32C-1 11 6-6 15-19" stroke="#7d955a" stroke-width="2" stroke-linecap="round"/><path d="M4 11c-14-1-22-15-16-24C0-13 6-1 4 11Z" fill="#91a772"/><path d="M8-3c15-1 23-13 18-22C14-27 8-14 8-3Z" fill="#779359"/><path d="M7 22c11 0 23-10 21-18C14 0 6 11 7 22Z" fill="#a4b783"/></g>
  <path d="M94 392l-13 4M105 411l-9 10M118 425l-4 13" stroke="#8da271" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <circle cx="438" cy="412" r="3" fill="#b5bf8f"/>
  <circle cx="450" cy="399" r="1.8" fill="#c4ca9d"/>
</svg>
